name: MAIN

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        # Test if the script runs without throwing any errors
        runs-on: ubuntu-latest
        name: test-generate
        steps:
            - name: Checkout repo and submodules
              uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm ci

            - name: Run generate script
              run: npm run generate

            - name: Commit and Push
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"

                # Only proceed if the generation script actually changed something
                if [[ -n "$(git status --porcelain)" ]]; then
                  git add .
                  git commit -m "Generate data [skip ci]"
                  git push origin HEAD:${{ github.head_ref }}
                else
                  echo "No changes detected after dependency update."
                fi

    prettier:
        # Check if prettier needs to be applied
        runs-on: ubuntu-latest
        name: prettier-check
        steps:
            - name: Checkout repo and submodules
              uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm ci

            - name: Run prettier
              run: npx prettier package.json "./src/**/*.ts" -c

    eslint:
        runs-on: ubuntu-latest
        name: eslint-check
        steps:
            - name: Checkout repo and submodules
              uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm ci

            - name: Run eslint
              run: npm run lint