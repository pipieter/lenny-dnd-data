name: GENERATED

on:
  pull_request:
    paths:
      - "generated/**"
      - "generated"
      - ".github/**"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lychee (link checker)
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --verbose
            --no-progress
            --include-fragments
            --max-redirects 10
            './data/**/*.json'

      - name: Fail if dead links found
        if: steps.lychee.outcome == 'failure'
        run: exit 1