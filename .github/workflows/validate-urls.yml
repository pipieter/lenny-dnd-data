name: VALIDATE-URLS
permissions:
  contents: read
  issues: write

on:
  push:
    paths:
      - ".github/workflows/validate-urls.yml"
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at 00:00 UTC

jobs:
  lychee-url-check:
    runs-on: ubuntu-latest
    name: lychee
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: mkdir -p lychee

      - name: Install & Run Lychee
        uses: lycheeverse/lychee-action@v1
        with:
          format: markdown
          output: lychee/out.md
          args: >
            --quiet
            --no-progress
            --include-fragments
            --max-redirects 10
            --format markdown
            './generated/*.json'

      - name: Create issue on failure
        if: steps.lychee.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const reportPath = "lychee/out.md";
            let body = "Lychee URL check failed, but no output file was found.";

            if (fs.existsSync(reportPath)) {
              body = fs.readFileSync(reportPath, "utf8");
            }

            // Create or update an existing issue with the same title
            const issueTitle = "Dead URLs Found in Repository";

            // Check if an open issue already exists
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
              }
            );

            const existing = issues.data.find(i => i.title === issueTitle);

            if (existing) {
              // Add comment instead of opening a new issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              // Create a new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body
              });
            }